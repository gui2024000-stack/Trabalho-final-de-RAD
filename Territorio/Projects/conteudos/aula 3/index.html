<!DOCTYPE html>
<html lang="pt-Br">
    <head>
        <meta charset="UTF-8">
        <title>Formúlario de contato</title>
        <style>
            body { font-family: Arial, sans-serif;max-width: 640;margin: 2rem auto; padding: 1rem; }
            label { display : block; margin-top: 1rem; }
            input,  textarea, button { width: 100%; padding: .6rem; margin-top: .3rem; }
            #mensagem { margin-top: 1rem; font-weight: bold }
        </style>
    </head>
    <body>
        <h1>Envie sua mensagem</h1>
        <form id="form">
            <label>Nome
                <input type = "text" name = "nome" required>
            </label>
            <label>E-mail
                <input type = "email" name = "email" required>
            </label>
            <label>Mensagem
                <textarea name = "texto" required></textarea>
            </label>

            <button type = "submit">Enviar</button>
        </form>
        <p id = "mensagem"></p>

        <script>
            const urlWebhook = "https://guilhermeemanuel1.app.n8n.cloud/webhook-test/c1ebdecb-3e77-40f7-a671-d0978ba8ce41";

            const form= document.getElementById("form");
            const msg= document.getElementById("mensagem");

            form.addEventListener("submit",async(e) =>{
                e.preventDefault();

                const dados = Object.fromEntries(new FormData(form).entries());
                
                try{
                    const r = await fetch(urlWebhook, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados)
                    });
                    if(!r.ok) throw new Error("Erro de envio");

                    const json = await r.json();

                    msg.textContent = json.mensagem;
                    msg.style.color = "green";
                    form.reset();
                }
                catch{
                    msg.textContent = "Não foi possível enviar. Tente novamente";
                    msg.style.color = "crimson";
                }
            })
        </script>
    </body>
</html>
